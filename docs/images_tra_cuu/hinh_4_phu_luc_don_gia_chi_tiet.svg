<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .font-serif { font-family: "Times New Roman", Times, serif; }
      .shadow { filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.12)); }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="680" fill="#475569"/>

  <!-- Document Paper Container (A4 Style) -->
  <rect x="50" y="20" width="900" height="640" rx="4" fill="#ffffff" stroke="#cbd5e1" class="shadow"/>

  <!-- Document Header -->
  <g transform="translate(80, 50)">
    <!-- Left Header -->
    <text x="0" y="0" class="font-serif" font-size="13" font-weight="bold" fill="#0f172a">BỘ KẾ HOẠCH VÀ ĐẦU TƯ</text>
    <text x="0" y="18" class="font-serif" font-size="13" font-weight="bold" fill="#0f172a" text-decoration="underline">CỤC CÔNG NGHỆ THÔNG TIN</text>
    <text x="0" y="38" class="font-serif" font-size="12" fill="#334155">Số: 158/QĐ-CNTT</text>

    <!-- Right Header -->
    <text x="500" y="0" class="font-serif" font-size="13" font-weight="bold" fill="#0f172a">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</text>
    <text x="540" y="18" class="font-serif" font-size="13" font-weight="bold" fill="#0f172a" text-decoration="underline">Độc lập - Tự do - Hạnh phúc</text>
    <text x="555" y="38" class="font-serif" font-size="12" font-style="italic" fill="#475569">Hà Nội, ngày 15 tháng 11 năm 2024</text>
  </g>

  <!-- Title of Annex -->
  <g transform="translate(500, 125)">
    <text x="0" y="0" class="font-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">PHỤ LỤC: DANH MỤC HÀNG HÓA VÀ ĐƠN GIÁ TRÚNG THẦU CHI TIẾT</text>
    <text x="0" y="20" class="font-serif" font-size="12" font-style="italic" fill="#475569" text-anchor="middle">(Kèm theo Quyết định số 158/QĐ-CNTT ngày 15/11/2024 của Cục Công nghệ Thông tin)</text>
    <text x="0" y="36" class="font-serif" font-size="12" fill="#0369a1" text-anchor="middle">Nhà thầu trúng thầu: Công ty Cổ phần Công nghệ và Truyền thông ABC</text>
  </g>

  <!-- Detailed Table -->
  <g transform="translate(70, 180)">
    <!-- Table Header -->
    <rect x="0" y="0" width="860" height="46" fill="#0054a6" rx="2"/>
    <text x="25" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">STT</text>
    <text x="140" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff">Tên hàng hóa / Thiết bị</text>
    <text x="285" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff">Ký mã hiệu / Model</text>
    <text x="435" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff">Hãng SX / Xuất xứ</text>
    <text x="555" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ĐVT</text>
    <text x="600" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">SL</text>
    <text x="685" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Đơn giá trúng thầu (VNĐ)</text>
    <text x="800" y="28" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Thành tiền (VNĐ)</text>

    <!-- Table Row 1 -->
    <rect x="0" y="46" width="860" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="78" class="font-sans" font-size="12" fill="#0f172a" text-anchor="middle">1</text>
    <text x="55" y="70" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a">Máy tính để bàn đồng bộ</text>
    <text x="55" y="86" class="font-sans" font-size="10" fill="#64748b">(Core i5-13400, RAM 16GB, SSD 512GB)</text>
    <text x="285" y="77" class="font-sans" font-size="11" fill="#1e293b">ThinkCentre M70t Gen 4</text>
    <text x="435" y="77" class="font-sans" font-size="11" fill="#1e293b">Lenovo / Trung Quốc</text>
    <text x="555" y="77" class="font-sans" font-size="11" fill="#1e293b" text-anchor="middle">Bộ</text>
    <text x="600" y="77" class="font-sans" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">50</text>
    <text x="685" y="77" class="font-sans" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">16.500.000</text>
    <text x="800" y="77" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">825.000.000</text>

    <!-- Table Row 2 -->
    <rect x="0" y="98" width="860" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="130" class="font-sans" font-size="12" fill="#0f172a" text-anchor="middle">2</text>
    <text x="55" y="122" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a">Máy in laser đa chức năng</text>
    <text x="55" y="138" class="font-sans" font-size="10" fill="#64748b">(In 2 mặt, Copy, Scan qua mạng LAN)</text>
    <text x="285" y="129" class="font-sans" font-size="11" fill="#1e293b">LaserJet Pro MFP M428fdw</text>
    <text x="435" y="129" class="font-sans" font-size="11" fill="#1e293b">HP / Việt Nam</text>
    <text x="555" y="129" class="font-sans" font-size="11" fill="#1e293b" text-anchor="middle">Chiếc</text>
    <text x="600" y="129" class="font-sans" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">15</text>
    <text x="685" y="129" class="font-sans" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">11.200.000</text>
    <text x="800" y="129" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">168.000.000</text>

    <!-- Table Row 3 -->
    <rect x="0" y="150" width="860" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="182" class="font-sans" font-size="12" fill="#0f172a" text-anchor="middle">3</text>
    <text x="55" y="174" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a">Bộ lưu điện UPS 1000VA / 600W</text>
    <text x="55" y="190" class="font-sans" font-size="10" fill="#64748b">(Bảo vệ nguồn máy vi tính)</text>
    <text x="285" y="181" class="font-sans" font-size="11" fill="#1e293b">Back-UPS Pro BR1000G</text>
    <text x="435" y="181" class="font-sans" font-size="11" fill="#1e293b">APC Schneider / Philippines</text>
    <text x="555" y="181" class="font-sans" font-size="11" fill="#1e293b" text-anchor="middle">Chiếc</text>
    <text x="600" y="181" class="font-sans" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">50</text>
    <text x="685" y="181" class="font-sans" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">3.750.000</text>
    <text x="800" y="181" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">187.500.000</text>

    <!-- Total Sum Row -->
    <rect x="0" y="202" width="860" height="44" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="350" y="229" class="font-sans" font-size="12" font-weight="bold" fill="#991b1b">TỔNG CỘNG GIÁ TRÚNG THẦU (ĐÃ GỒM THUẾ GTGT):</text>
    <text x="800" y="229" class="font-sans" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">1.180.500.000 VNĐ</text>
  </g>

  <!-- Bottom Annotation Box -->
  <g transform="translate(70, 455)">
    <rect x="0" y="0" width="860" height="180" fill="#eff6ff" stroke="#bfdbfe" rx="6"/>
    <text x="25" y="28" class="font-sans" font-size="13" font-weight="bold" fill="#1e40af">🎯 Ý NGHĨA QUAN TRỌNG CỦA PHỤ LỤC ĐƠN GIÁ NÀY:</text>
    
    <text x="25" y="55" class="font-sans" font-size="12" fill="#1e3a8a">1. <tspan font-weight="bold">Biết chính xác đơn giá từng thiết bị:</tspan> Bạn không chỉ biết tổng giá trị gói thầu mà biết rõ đơn giá trúng thầu của từng chiếc máy tính (16.500.000đ), máy in (11.200.000đ)...</text>
    
    <text x="25" y="82" class="font-sans" font-size="12" fill="#1e3a8a">2. <tspan font-weight="bold">Làm căn cứ lập dự toán / thẩm định giá:</tspan> Theo quy định pháp luật đấu thầu, giá trúng thầu của các gói thầu tương tự trong vòng 12 tháng trên Hệ thống mạng đấu thầu quốc gia là nguồn tài liệu hợp pháp, tin cậy hàng đầu để xây dựng giá gói thầu mới.</text>

    <text x="25" y="110" class="font-sans" font-size="12" fill="#1e3a8a">3. <tspan font-weight="bold">Đối chiếu tính tương đương kỹ thuật:</tspan> Bảng phụ lục nêu rõ <tspan font-weight="bold">Ký mã hiệu (Model), Hãng sản xuất và Xuất xứ</tspan>, giúp so sánh chính xác giữa cấu hình kỹ thuật và mức giá trúng thầu thực tế.</text>

    <rect x="25" y="130" width="810" height="35" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="40" y="152" class="font-sans" font-size="12" font-weight="bold" fill="#0369a1">📌 LƯU Ý CHO NGƯỜI MỚI:</text>
    <text x="195" y="152" class="font-sans" font-size="11" fill="#334155">Luôn kiểm tra ghi chú của file xem đơn giá đã bao gồm thuế GTGT (VAT) 8% hoặc 10% và chi phí vận chuyển, lắp đặt hay chưa.</text>
  </g>
</svg>
