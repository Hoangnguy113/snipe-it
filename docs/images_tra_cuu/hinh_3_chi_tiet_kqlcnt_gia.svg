<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .shadow { filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08)); }
      .step-text { fill: #ffffff; font-weight: bold; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="720" fill="#f1f5f9"/>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="960" height="690" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" class="shadow"/>

  <!-- Browser Header Bar -->
  <path d="M 20 25 Q 20 15 30 15 L 970 15 Q 980 15 980 25 L 980 55 L 20 55 Z" fill="#e2e8f0"/>
  <circle cx="45" cy="35" r="6" fill="#ef4444"/>
  <circle cx="65" cy="35" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="35" r="6" fill="#10b981"/>
  <rect x="120" y="24" width="700" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="40" class="font-sans" font-size="12" fill="#64748b">🔒 https://muasamcong.mpi.gov.vn/web/guest/tender-detail?id=IB2400085942</text>

  <!-- Package Top Info Header -->
  <rect x="40" y="68" width="920" height="70" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="55" y="90" class="font-sans" font-size="11" font-weight="bold" fill="#0054a6">MÃ TBMT: IB2400085942-00</text>
  <text x="210" y="90" class="font-sans" font-size="11" fill="#64748b">| Hình thức: Chào hàng cạnh tranh qua mạng | Lĩnh vực: Hàng hóa</text>
  <text x="55" y="112" class="font-sans" font-size="14" font-weight="bold" fill="#0f172a">Gói thầu số 01: Mua sắm máy vi tính, máy in văn phòng năm 2024</text>
  <text x="55" y="130" class="font-sans" font-size="11" fill="#475569">Bên mời thầu: Văn phòng Cục Công nghệ Thông tin - Bộ Kế hoạch và Đầu tư</text>

  <!-- Horizontal Detail Tabs Bar -->
  <g transform="translate(40, 150)">
    <!-- Tab 1 -->
    <rect x="0" y="0" width="140" height="38" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="70" y="24" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">1. Thông tin chung</text>

    <!-- Tab 2 -->
    <rect x="145" y="0" width="140" height="38" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="215" y="24" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">2. Kế hoạch LCNT</text>

    <!-- Tab 3 -->
    <rect x="290" y="0" width="140" height="38" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="360" y="24" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">3. Kết quả mở thầu</text>

    <!-- Tab 4: SELECTED (KẾT QUẢ LỰA CHỌN NHÀ THẦU) -->
    <rect x="435" y="0" width="240" height="38" fill="#0054a6" stroke="#004080" rx="4"/>
    <text x="555" y="24" class="font-sans" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">★ 4. KẾT QUẢ LỰA CHỌN NHÀ THẦU</text>

    <!-- Tab 5 -->
    <rect x="680" y="0" width="110" height="38" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="735" y="24" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">5. Hợp đồng</text>
  </g>

  <!-- Main Information Box for Tab 4 -->
  <rect x="40" y="195" width="920" height="380" fill="#ffffff" stroke="#0054a6" stroke-width="1.5" rx="6" class="shadow"/>

  <!-- Decision Header Info -->
  <rect x="55" y="210" width="890" height="34" fill="#eff6ff" rx="4"/>
  <text x="70" y="232" class="font-sans" font-size="12" font-weight="bold" fill="#1e40af">Số Quyết định phê duyệt KQLCNT: <tspan fill="#dc2626">158/QĐ-CNTT</tspan> | Ngày ban hành: <tspan fill="#1e3a8a">15/11/2024</tspan> | Người ký: Giám đốc Cục</text>

  <!-- Awarded Supplier & Price Details Card -->
  <g transform="translate(55, 255)">
    <!-- Left Column: Supplier Info -->
    <rect x="0" y="0" width="435" height="180" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
    <text x="15" y="25" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a">🏢 THÔNG TIN NHÀ THẦU TRÚNG THẦU</text>
    
    <text x="15" y="55" class="font-sans" font-size="11" fill="#64748b">Tên nhà thầu:</text>
    <text x="15" y="73" class="font-sans" font-size="13" font-weight="bold" fill="#0054a6">CÔNG TY CỔ PHẦN CÔNG NGHỆ VÀ TRUYỀN THÔNG ABC</text>

    <text x="15" y="100" class="font-sans" font-size="11" fill="#64748b">Mã số thuế / Mã định danh:</text>
    <text x="15" y="118" class="font-sans" font-size="12" font-weight="bold" fill="#1e293b">0102345678</text>

    <text x="15" y="142" class="font-sans" font-size="11" fill="#64748b">Địa chỉ trụ sở:</text>
    <text x="15" y="160" class="font-sans" font-size="11" fill="#334155">Số 123 Đường Láng, Phường Láng Thượng, Đống Đa, Hà Nội</text>

    <!-- Right Column: Price & Contract Info -->
    <rect x="455" y="0" width="435" height="180" fill="#fffbeb" stroke="#fde68a" rx="6"/>
    <text x="470" y="25" class="font-sans" font-size="12" font-weight="bold" fill="#92400e">💰 THÔNG TIN GIÁ &amp; HỢP ĐỒNG</text>

    <text x="470" y="55" class="font-sans" font-size="11" fill="#78350f">Giá gói thầu (Dự toán duyệt):</text>
    <text x="470" y="74" class="font-sans" font-size="14" font-weight="bold" fill="#475569">1.250.000.000 VNĐ</text>

    <!-- Crucial Highlight: Awarded Price -->
    <rect x="468" y="85" width="405" height="50" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="4"/>
    <text x="480" y="105" class="font-sans" font-size="12" font-weight="bold" fill="#991b1b">GIÁ TRÚNG THẦU (ĐÃ GỒM VAT):</text>
    <text x="480" y="127" class="font-sans" font-size="18" font-weight="bold" fill="#dc2626">1.180.500.000 VNĐ</text>
    <text x="735" y="125" class="font-sans" font-size="11" font-weight="bold" fill="#15803d">Tiết kiệm: 5,56%</text>

    <text x="470" y="153" class="font-sans" font-size="11" fill="#78350f">Loại hợp đồng: <tspan font-weight="bold" fill="#1e293b">Trọn gói</tspan></text>
    <text x="660" y="153" class="font-sans" font-size="11" fill="#78350f">Thời gian thực hiện: <tspan font-weight="bold" fill="#1e293b">60 ngày</tspan></text>
  </g>

  <!-- Attachment Downloads Section (Quyết định & Phụ lục) -->
  <g transform="translate(55, 450)">
    <rect x="0" y="0" width="890" height="110" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
    <text x="15" y="25" class="font-sans" font-size="12" font-weight="bold" fill="#0f172a">📎 TỆP ĐÍNH KÈM (XEM ĐƠN GIÁ CHI TIẾT TỪNG MÃ HÀNG HÓA):</text>

    <!-- File Item 1: Quyết định kèm phụ lục giá -->
    <rect x="15" y="38" width="530" height="58" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" rx="4"/>
    <rect x="25" y="47" width="38" height="40" rx="3" fill="#fee2e2"/>
    <text x="44" y="72" class="font-sans" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">PDF</text>
    <text x="75" y="58" class="font-sans" font-size="12" font-weight="bold" fill="#0054a6">Quyet_dinh_158_phe_duyet_KQLCNT_kem_phu_luc_gia.pdf</text>
    <text x="75" y="78" class="font-sans" font-size="11" fill="#64748b">Dung lượng: 1.8 MB | Ngày đăng: 15/11/2024 (Chứa phụ lục chi tiết từng model &amp; đơn giá)</text>

    <!-- Download Button 1 -->
    <rect x="560" y="45" width="130" height="42" fill="#16a34a" rx="4"/>
    <text x="625" y="71" class="font-sans" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⬇ TẢI VỀ FILE</text>

    <!-- File Item 2: Báo cáo đánh giá -->
    <rect x="710" y="45" width="165" height="42" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="792" y="71" class="font-sans" font-size="11" fill="#475569" text-anchor="middle">📄 Báo cáo đánh giá HSDT</text>
  </g>

  <!-- Badges / Step Callouts -->
  <g transform="translate(555, 135)">
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
    <text x="0" y="0" class="step-text">1</text>
  </g>

  <g transform="translate(935, 345)">
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
    <text x="0" y="0" class="step-text">2</text>
  </g>

  <g transform="translate(680, 485)">
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
    <text x="0" y="0" class="step-text">3</text>
  </g>

  <!-- Guide Annotation Bar Bottom -->
  <rect x="40" y="590" width="920" height="105" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="65" y="613" class="font-sans" font-size="13" font-weight="bold" fill="#1e40af">💡 HƯỚNG DẪN THAO TÁC XEM GIÁ:</text>
  <text x="65" y="635" class="font-sans" font-size="12" fill="#1e3a8a"><tspan font-weight="bold" fill="#dc2626">[Bước 1]:</tspan> Nhấp chọn vào Tab <tspan font-weight="bold">"4. KẾT QUẢ LỰA CHỌN NHÀ THẦU"</tspan> trên thanh menu ngang.</text>
  <text x="65" y="655" class="font-sans" font-size="12" fill="#1e3a8a"><tspan font-weight="bold" fill="#dc2626">[Bước 2]:</tspan> Đọc <tspan font-weight="bold" fill="#dc2626">GIÁ TRÚNG THẦU TỔNG CỘNG</tspan> của gói thầu và thông tin nhà thầu thắng thầu.</text>
  <text x="65" y="675" class="font-sans" font-size="12" fill="#1e3a8a"><tspan font-weight="bold" fill="#dc2626">[Bước 3]:</tspan> Bấm nút <tspan font-weight="bold" fill="#16a34a">"⬇ TẢI VỀ FILE"</tspan> tại mục Quyết định phê duyệt để mở Phụ lục đơn giá chi tiết từng mặt hàng.</text>
</svg>
