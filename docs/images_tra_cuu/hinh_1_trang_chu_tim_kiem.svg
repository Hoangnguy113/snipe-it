<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .shadow { filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08)); }
      .badge-step { fill: #dc2626; font-weight: bold; font-size: 13px; }
      .step-text { fill: #ffffff; font-weight: bold; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004b93"/>
      <stop offset="100%" stop-color="#0066c0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="640" fill="#f1f5f9"/>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="960" height="605" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" class="shadow"/>

  <!-- Browser Header Bar -->
  <path d="M 20 25 Q 20 15 30 15 L 970 15 Q 980 15 980 25 L 980 55 L 20 55 Z" fill="#e2e8f0"/>
  <circle cx="45" cy="35" r="6" fill="#ef4444"/>
  <circle cx="65" cy="35" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="35" r="6" fill="#10b981"/>

  <!-- Address Bar -->
  <rect x="120" y="24" width="700" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="40" class="font-sans" font-size="12" fill="#64748b">🔒 https://muasamcong.mpi.gov.vn</text>

  <!-- Website Top Header -->
  <rect x="20" y="55" width="960" height="65" fill="url(#headerGrad)"/>
  
  <circle cx="65" cy="87" r="20" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="65" y="91" class="font-sans" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
  
  <text x="98" y="80" class="font-sans" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="0.5">HỆ THỐNG MẠNG ĐẤU THẦU QUỐC GIA</text>
  <text x="98" y="98" class="font-sans" font-size="12" fill="#e0f2fe">BỘ KẾ HOẠCH VÀ ĐẦU TƯ</text>

  <!-- Top Navigation Items -->
  <text x="560" y="92" class="font-sans" font-size="13" fill="#ffffff">Trang chủ</text>
  <text x="635" y="92" class="font-sans" font-size="13" fill="#ffffff">Giới thiệu</text>
  <text x="705" y="92" class="font-sans" font-size="13" font-weight="bold" fill="#fef08a">Tra cứu thông tin ▾</text>
  <text x="840" y="92" class="font-sans" font-size="13" fill="#ffffff">Cơ sở dữ liệu</text>
  <rect x="915" y="73" width="50" height="28" rx="4" fill="#0284c7"/>
  <text x="940" y="91" class="font-sans" font-size="12" fill="#ffffff" text-anchor="middle">Đăng nhập</text>

  <!-- Main Content Area: Search Box Container -->
  <rect x="50" y="145" width="900" height="340" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" class="shadow"/>

  <!-- Search Header Title -->
  <rect x="50" y="145" width="900" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="75" y="172" class="font-sans" font-size="15" font-weight="bold" fill="#0f172a">🔍 TÌM KIẾM THÔNG TIN ĐẤU THẦU</text>

  <!-- Search Category Tabs -->
  <g transform="translate(70, 205)">
    <!-- Tab 1 -->
    <rect x="0" y="0" width="120" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="60" y="21" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">Dự án</text>

    <!-- Tab 2 -->
    <rect x="130" y="0" width="150" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="205" y="21" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">Kế hoạch LCNT</text>

    <!-- Tab 3 -->
    <rect x="290" y="0" width="160" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="370" y="21" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">Thông báo mời thầu</text>

    <!-- Tab 4: SELECTED (KẾT QUẢ LCNT) -->
    <rect x="460" y="0" width="220" height="34" rx="4" fill="#0054a6" stroke="#004080"/>
    <text x="570" y="21" class="font-sans" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">KẾT QUẢ LỰA CHỌN NHÀ THẦU</text>

    <!-- Tab 5 -->
    <rect x="690" y="0" width="170" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="775" y="21" class="font-sans" font-size="12" fill="#475569" text-anchor="middle">Kết quả mở thầu</text>
  </g>

  <!-- Search Input Fields -->
  <g transform="translate(70, 265)">
    <!-- Label -->
    <text x="0" y="15" class="font-sans" font-size="13" font-weight="bold" fill="#1e293b">Từ khóa tìm kiếm (Số TBMT / Tên gói thầu / Tên bên mời thầu):</text>
    
    <!-- Input Box -->
    <rect x="0" y="25" width="700" height="46" rx="6" fill="#ffffff" stroke="#0054a6" stroke-width="2"/>
    <text x="18" y="53" class="font-sans" font-size="14" fill="#334155">IB2300018594 hoặc "mua sắm máy tính" hoặc "Cục Tin học"</text>
    
    <!-- Clear Icon -->
    <circle cx="680" cy="48" r="9" fill="#e2e8f0"/>
    <text x="680" y="52" class="font-sans" font-size="11" fill="#64748b" text-anchor="middle">✕</text>

    <!-- Search Button -->
    <rect x="715" y="25" width="145" height="46" rx="6" fill="#0054a6"/>
    <text x="787" y="53" class="font-sans" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🔍 TÌM KIẾM</text>
  </g>

  <!-- Advanced Filters Row -->
  <g transform="translate(70, 360)">
    <!-- Filter 1: Lĩnh vực -->
    <text x="0" y="12" class="font-sans" font-size="12" fill="#475569">Lĩnh vực:</text>
    <rect x="0" y="20" width="190" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="12" y="42" class="font-sans" font-size="12" fill="#1e293b">-- Tất cả lĩnh vực --</text>
    <text x="170" y="42" class="font-sans" font-size="10" fill="#64748b">▼</text>

    <!-- Filter 2: Khoảng thời gian -->
    <text x="210" y="12" class="font-sans" font-size="12" fill="#475569">Thời gian công khai KQLCNT:</text>
    <rect x="210" y="20" width="170" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="222" y="42" class="font-sans" font-size="12" fill="#1e293b">Từ ngày (dd/mm/yyyy)</text>
    <rect x="390" y="20" width="170" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="402" y="42" class="font-sans" font-size="12" fill="#1e293b">Đến ngày (dd/mm/yyyy)</text>

    <!-- Filter 3: Tỉnh/Thành -->
    <text x="580" y="12" class="font-sans" font-size="12" fill="#475569">Địa bàn thực hiện:</text>
    <rect x="580" y="20" width="180" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="592" y="42" class="font-sans" font-size="12" fill="#1e293b">-- Toàn quốc --</text>
    <text x="742" y="42" class="font-sans" font-size="10" fill="#64748b">▼</text>

    <!-- Reset filter text -->
    <text x="785" y="42" class="font-sans" font-size="12" fill="#0284c7">Xóa bộ lọc</text>
  </g>

  <!-- Callouts -->
  <g transform="translate(570, 190)">
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
    <text x="0" y="0" class="step-text">1</text>
  </g>

  <g transform="translate(370, 255)">
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
    <text x="0" y="0" class="step-text">2</text>
  </g>

  <g transform="translate(860, 290)">
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
    <text x="0" y="0" class="step-text">3</text>
  </g>

  <!-- Guide Annotation Bar Bottom -->
  <rect x="50" y="505" width="900" height="95" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="530" class="font-sans" font-size="13" font-weight="bold" fill="#1e40af">💡 HƯỚNG DẪN THAO TÁC TRÊN BƯỚC NÀY:</text>
  <text x="75" y="555" class="font-sans" font-size="12" fill="#1e3a8a"><tspan font-weight="bold" fill="#dc2626">[Bước 1]:</tspan> Nhấp chọn trực tiếp vào tab <tspan font-weight="bold">"KẾT QUẢ LỰA CHỌN NHÀ THẦU"</tspan> để lọc chính xác các gói thầu đã duyệt trúng thầu.</text>
  <text x="75" y="575" class="font-sans" font-size="12" fill="#1e3a8a"><tspan font-weight="bold" fill="#dc2626">[Bước 2]:</tspan> Nhập <tspan font-weight="bold">Số thông báo mời thầu (Số TBMT)</tspan> (chính xác nhất) hoặc <tspan font-weight="bold">Tên gói thầu / thiết bị</tspan> cần xem giá.</text>
  <text x="75" y="593" class="font-sans" font-size="12" fill="#1e3a8a"><tspan font-weight="bold" fill="#dc2626">[Bước 3]:</tspan> Nhấn nút <tspan font-weight="bold">"TÌM KIẾM"</tspan> (hoặc phím Enter) để hiển thị danh sách các kết quả.</text>
</svg>
