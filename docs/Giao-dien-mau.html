<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản lý Trang thiết bị CNTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #eef3fb;
    --ink: #10233f;
    --muted: #5b6d88;
    --line: #d5e2f4;
    --blue: #1d4ed8;
    --blue-2: #3b82f6;
    --gold: #eab308;
    --card: #ffffff;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Be Vietnam Pro", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #e7f0ff 0%, var(--bg) 220px);
    color: var(--ink);
    display: grid;
    grid-template-columns: 280px 1fr;
  }
  aside {
    background: #fff;
    border-right: 1px solid var(--line);
    min-height: 100vh;
    position: sticky; top: 0; height: 100vh; overflow: auto;
    padding: 18px 12px 20px;
  }
  .brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 14px; }
  .seal {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: #1d4ed8; color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 12px; box-shadow: 0 0 0 3px #facc15;
  }
  .brand b { display: block; font-size: 14px; line-height: 1.25; color: #10233f; }
  .brand span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; line-height: 1.35; }
  .find {
    width: 100%; border: 1px solid var(--line); background: #f8fbff; color: var(--ink);
    border-radius: 12px; padding: 9px 12px; outline: none; margin: 4px 0 8px;
  }
  .grp { margin: 14px 8px 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7c8eab; }
  .navbtn {
    width: 100%; text-align: left; border: 0; background: transparent; color: #1e3358;
    border-radius: 12px; padding: 9px 10px; display: flex; gap: 8px; align-items: center;
    cursor: pointer; font-size: 13.5px; font-weight: 600;
  }
  .navbtn:hover { background: #f3f7ff; }
  .navbtn.active { background: #1d4ed8; color: #fff; }
  .navbtn.active .n { color: #facc15; }
  .navbtn .n { margin-left: auto; color: #1d4ed8; font-size: 12px; font-weight: 800; }
  .credit { margin-top: 18px; padding: 12px; color: var(--muted); font-size: 11.5px; line-height: 1.45; border-top: 1px solid var(--line); }
  main { min-width: 0; }
  .top {
    margin: 16px 22px 0; padding: 16px 18px; border-radius: 18px;
    background: linear-gradient(90deg, #1d4ed8, #3b82f6);
    display: flex; align-items: flex-start; gap: 16px; color: #fff;
  }
  .top h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: .04em; color: #facc15; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .top p { margin: 6px 0 0; color: #e0edff; font-size: 13px; }
  .clock { margin-left: auto; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); border-radius: 16px; padding: 8px 14px; text-align: right; min-width: 168px; }
  .clock b { display: block; font-size: 22px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .clock span { color: #e0edff; font-size: 12px; }
  .wrap { padding: 14px 22px 28px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi, .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(16, 35, 63, .04); }
  .kpi { padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .val { font-size: 30px; font-weight: 800; margin-top: 2px; color: #1d4ed8; }
  .kpi .sub { color: #b45309; font-size: 12px; margin-top: 4px; }
  .grid-2 { display: grid; grid-template-columns: 1.3fr .7fr; gap: 12px; margin-top: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }
  .card { padding: 14px 16px 16px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; color: #10233f; }
  .card h3 span { color: var(--muted); font-weight: 500; font-size: 12px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  th { text-align: left; color: #fff; font-size: 12px; letter-spacing: .06em; padding: 10px; background: #1d4ed8; }
  thead th:first-child { border-radius: 12px 0 0 0; }
  thead th:last-child { border-radius: 0 12px 0 0; }
  td { padding: 10px; background: #fff; border-bottom: 1px solid #eef2f8; color: #10233f; }
  tr.hot td { background: #ecfdf5; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .on { background: #dcfce7; color: #166534; }
  .wait { background: #fef3c7; color: #b45309; }
  .off { background: #fee2e2; color: #b91c1c; }
  .info { background: #e0ecff; color: #1d4ed8; }
  .stt { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #e0ecff; color: #1d4ed8; font-weight: 800; }
  .stt.live { background: #22c55e; color: #052e16; }
  .btn { border: 1px solid #c9daf8; background: #eef4ff; color: #1d4ed8; border-radius: 12px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 13px; text-decoration: none; display: inline-flex; }
  .btn.gold { background: #facc15; color: #1a1403; border-color: #eab308; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: 128px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; }
  .track { height: 8px; background: #e8eef8; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg, #1d4ed8, #38bdf8); border-radius: 99px; }
  .note { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .hb { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .meter { height: 6px; background: #e8eef8; border-radius: 99px; overflow: hidden; margin: 4px 0 8px; }
  .meter i { display: block; height: 100%; background: #22c55e; }
  .meter.warn i { background: #f59e0b; }
  .meter.bad i { background: #ef4444; }
  .toast { position: fixed; right: 18px; bottom: 18px; background: #1d4ed8; color: white; padding: 12px 14px; border-radius: 14px; display: none; z-index: 9; }
  .reports { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rep { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .sw { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 5px; }

  .ico { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
  .navbtn .ico { opacity: .9; }
  .kpi .label .ico, .card h3 .ico { margin-right: 6px; }
  .with-ico { display: inline-flex; align-items: center; gap: 8px; }

  .perm { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid #eef2f8; font-size:13px; }
  .switch { width:36px; height:20px; border-radius:99px; border:0; background:#d5e2f4; cursor:pointer; position:relative; }
  .switch.on { background:#1d4ed8; }
  .switch i { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .switch.on i { left:18px; }
  .who { margin-top:10px; }
  .who select { width:100%; border:1px solid var(--line); border-radius:10px; padding:8px; background:#f8fbff; color:var(--ink); }
  @media (max-width: 1100px) {
    body { grid-template-columns: 1fr; }
    aside { position: relative; height: auto; }
    .kpis, .grid-2, .grid-3, .reports { grid-template-columns: 1fr; }
  }
</style>
</head>

function tick() {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('vi-VN');
  document.getElementById('date').textContent = d.toLocaleDateString('vi-VN', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' });
}
setInterval(tick, 1000); tick();
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2200); }
function pill(s, t) { return `<span class="pill ${s}">${t}</span>`; }
function hbars(items) {
  const max = Math.max(...items.map(i => i.v), 1);
  return `<div class="bars">${items.map(i => `<div class="bar-row"><span>${i.l}</span><div class="track"><div class="fill" style="width:${Math.round(i.v/max*100)}%"></div></div><b>${i.v}</b></div>`).join('')}</div>`;
}
function donut(parts) {
  const total = parts.reduce((s,p)=>s+p.v,0) || 1;
  let a = -Math.PI/2; const cx=90, cy=90, r=64;
  const arcs = parts.map(p => {
    const ang = p.v/total*Math.PI*2;
    const x1 = cx+r*Math.cos(a), y1 = cy+r*Math.sin(a); a += ang;
    const x2 = cx+r*Math.cos(a), y2 = cy+r*Math.sin(a);
    return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${ang>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${p.c}"/>`;
  }).join('');
  return `<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 180 180" width="150" height="150">${arcs}<circle cx="90" cy="90" r="40" fill="#ffffff"/></svg><div class="legend" style="flex-direction:column">${parts.map(p=>`<span><i class="sw" style="background:${p.c}"></i>${p.l} · ${p.v}</span>`).join('')}</div></div>`;
}
function nav() {
  const q = (document.getElementById('navFilter').value || '').toLowerCase();
  const groups = [
    ['Điều hành', [['overview','Tổng quan',''], ['alerts','Hàng chờ duyệt', ALERTS.filter(a=>a.state==='wait').length], ['agents','Tác tử & nhịp tim', AGENTS.length], ['remote','Điều khiển từ xa',''], ['unmatched','Chưa khớp sổ','2']]],
    ['Danh mục', CATS.map(c => ['cat:'+c.key, c.name, c.n])],
    ['Báo cáo Word', [['reports','Biên bản & báo cáo', REPORTS.length], ['inventory','Đường ống kiểm kê',''], ['components','Cây linh kiện',''], ['snmp','SNMP máy in / mạng','']]],
    ['Phân quyền & địa bàn', [['users','Tài khoản quản trị', USERS.length], ['roles','Quyền theo tòa nhà', BUILDINGS.length], ['places','Biểu đồ khoa phòng / tòa nhà', DEPTS.length]]]
  ];
  document.getElementById('nav').innerHTML = groups.map(([g, rows]) => {
    const vis = rows.filter(r => r[1].toLowerCase().includes(q));
    if (!vis.length) return '';
    return `<div class="grp">${g}</div>` + vis.map(r => {
      const on = r[0] === current || (current==='cat' && r[0]==='cat:'+catKey);
      const key = r[0].startsWith('cat:') ? r[0].slice(4) : r[0];
      return `<button class="navbtn ${on?'active':''}" data-go="${r[0]}">${ico(key)}<span>${r[1]}</span><span class="n">${r[2]}</span></button>`;
    }).join('');
  }).join('');
  document.querySelectorAll('.navbtn').forEach(b => b.onclick = () => go(b.dataset.go));
}
function go(id) { if (id.startsWith('cat:')) { catKey = id.slice(4); current = 'cat'; } else current = id; render(); }

      </tbody></table></div>`;
}
function alerts() {
  head('Hàng chờ duyệt', 'Duyệt thì ghi sổ và lập phiếu. Từ chối thì cây linh kiện không đổi.', 'alerts');
  view.innerHTML = `<div class="card"><table><thead><tr><th>Mã</th><th>Máy</th><th>Thay đổi</th><th></th></tr></thead><tbody>
    ${ALERTS.map(a=>`<tr><td>${a.id}</td><td><b>${a.host}</b><div class="note">${a.dept}</div></td><td>${a.what}</td><td>${a.state==='wait'?`<div class="row-actions"><button class="btn gold" data-ok="${a.id}">Duyệt</button><button class="btn" data-no="${a.id}">Từ chối</button></div>`:pill(a.state==='ok'?'on':'off', a.state==='ok'?'ĐÃ GHI SỔ':'KHÔNG ĐỔI')}</td></tr>`).join('')}
  </tbody></table><p class="note">CHƯA PHÂN NHÓM không sinh khoa phòng — máy nằm ở Kho. Thu hồi thì tự về Kho. <a class="btn" href="bao-cao/07-phieu-thay-linh-kien.docx" download>Xuất phiếu Word</a></p></div>`;
  view.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { ALERTS.find(x=>x.id===b.dataset.ok).state='ok'; toast('Đã duyệt — cập nhật cây và phiếu bảo trì'); render(); });
  view.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { ALERTS.find(x=>x.id===b.dataset.no).state='no'; toast('Từ chối — cây giữ nguyên'); render(); });
}

  view.querySelectorAll('[data-rd]').forEach(b => b.onclick = () => {
    if (!can('Điều khiển từ xa')) { toast('403 — '+me().name+' không có quyền điều khiển'); return; }
    document.getElementById('rdlog').insertAdjacentHTML('afterbegin', `<div>${new Date().toLocaleTimeString('vi-VN')} · ${me().name} mở ${b.dataset.rd} · tòa ${me().buildings.join(',')}</div>`);
    toast('Đã ghi nhật ký '+b.dataset.rd);

}

function fillSession() {
  const sel = document.getElementById('sessionUser');
  if (!sel) return;
  sel.innerHTML = USERS.map((u,i)=>`<option value="${i}">${u.name}</option>`).join('');
  sel.value = String(session);
  sel.onchange = () => { session = Number(sel.value); toast('Đổi phiên: '+me().name+' · '+me().buildings.join(', ')); render(); };
  document.getElementById('scopeNote').textContent = me().role+' · tòa '+me().buildings.join(', ');
}
function users() {
  head('Tài khoản quản trị', 'Mỗi tài khoản gắn một hoặc nhiều tòa nhà. Ngoài phạm vi thì không duyệt, không điều khiển.', 'users');
  view.innerHTML = `<div class="card"><table><thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Tòa nhà</th><th>Quyền</th><th></th></tr></thead><tbody>
    ${USERS.map((u,i)=>`<tr class="${i===session?'hot':''}"><td><b>${u.name}</b></td><td>${u.role}</td><td>${u.buildings.map(b=>'Nhà '+b).join(', ')}</td><td class="note">${u.perms.join(' · ')}</td><td><button class="btn" data-as="${i}">Dùng phiên này</button></td></tr>`).join('')}
  </tbody></table><p class="note">Tài khoản Hoàng Chí Ngụy thấy cả bốn tòa. Quản trị Nhà A không mở được máy Nhà B.</p></div>`;
  view.querySelectorAll('[data-as]').forEach(b => b.onclick = () => { session = Number(b.dataset.as); toast('Đang dùng '+me().name); render(); });
}
function roles() {
  head('Quyền theo tòa nhà', 'Bật tắt quyền của phiên đang đăng nhập. Điều khiển từ xa không có quyền thì từ chối.', 'roles');
  const u = me();
  view.innerHTML = `<div class="grid-2"><div class="card"><h3>${ico('roles')} ${u.name}</h3><p class="note">${u.role}</p>
    ${PERMS.map(p=>`<div class="perm"><span>${p}</span><button class="switch ${u.perms.includes(p)?'on':''}" data-perm="${p}"><i></i></button></div>`).join('')}
  </div><div class="card"><h3>${ico('building')} Phạm vi tòa nhà</h3>
    ${BUILDINGS.map(b=>`<div class="perm"><span>${b.name}</span><button class="switch ${u.buildings.includes(b.id)?'on':''}" data-b="${b.id}"><i></i></button></div>`).join('')}
    <p class="note">Không gán tòa nhà thì tài khoản chỉ thấy Kho, không sinh khoa phòng mới.</p></div></div>`;
  view.querySelectorAll('[data-perm]').forEach(b => b.onclick = () => {
    const p = b.dataset.perm;
    const i = u.perms.indexOf(p);
    if (i>=0) u.perms.splice(i,1); else u.perms.push(p);
    toast((i>=0?'Tắt ':'Bật ')+p);
    render();
  });
  view.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    const id = b.dataset.b;
    const i = u.buildings.indexOf(id);
    if (i>=0) u.buildings.splice(i,1); else u.buildings.push(id);
    toast((i>=0?'Gỡ ':'Gán ')+'Nhà '+id);
    render();
  });
}
function places() {
  head('Khoa phòng và tòa nhà', 'Biểu đồ số thiết bị theo khoa phòng và theo tòa. Lọc theo phạm vi tài khoản đang đăng nhập.', 'dept');
  const allowed = new Set(me().buildings);
  const deps = DEPTS.filter(d => allowed.has(d.building));
  const blds = BUILDINGS.filter(b => allowed.has(b.id));
  view.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">${ico('building')} Tòa được xem</div><div class="val">${blds.length}</div><div class="sub">${me().buildings.join(', ')||'không có'}</div></div>
      <div class="kpi"><div class="label">${ico('dept')} Khoa phòng</div><div class="val">${deps.length}</div><div class="sub">Trong phạm vi</div></div>
      <div class="kpi"><div class="label">${ico('computers')} Thiết bị</div><div class="val">${deps.reduce((s,d)=>s+d.n,0)}</div><div class="sub">Đang bật ${deps.reduce((s,d)=>s+d.on,0)}</div></div>
      <div class="kpi"><div class="label">${ico('alerts')} Cần chú ý</div><div class="val">${blds.reduce((s,b)=>s+b.warn,0)}</div><div class="sub">Theo tòa</div></div>
    </div>
    <div class="grid-2">
      <div class="card"><h3>${ico('dept')} Theo khoa phòng</h3>${hbars(deps.map(d=>({l:d.name,v:d.n})))}</div>
      <div class="card"><h3>${ico('building')} Theo tòa nhà</h3>${donut(blds.map((b,i)=>({l:b.name.split('—')[0], v:b.assets, c:['#1d4ed8','#0ea5e9','#16a34a','#f59e0b'][i]})))}</div>
    </div>
    <div class="card" style="margin-top:12px"><h3>Đang bật theo tòa</h3>${hbars(blds.map(b=>({l:b.name.split('—')[0]+' bật', v:b.on})))}</div>`;
}
function render() { fillSession(); nav(); ({overview, alerts, agents, remote, unmatched, reports, inventory, components, snmp, users, roles, places, cat: catView}[current] || overview)(); }

document.getElementById('navFilter').oninput = nav;
render();
</script>
